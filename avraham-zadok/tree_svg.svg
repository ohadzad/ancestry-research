<svg id="famtree" role="img" aria-labelledby="famtree-t famtree-d" viewBox="0 0 1648 1000" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" direction="rtl">
<title id="famtree-t">עץ משפחת צדוק–פריינטה — שבע שורות דורות</title><desc id="famtree-d">תרשים שושלת בשבע שורות. בראש: שלמה ושמחה ארואץ (ילידי גיברלטר, מפקד יפו 1855) ולצדם ענף אלעזר ומסודה, וכן משפחת צאלח מצנעא. משם: יוסף וגרסיה ארואס ואחיו משה ואליהו; הסבים יצחק פפו פריינטה ומרים ארואס מזה ואברהם וסעדה צדוק מזה; ההורים אהרון צדוק ושושנה רוזה פריינטה ואחיהם; חמשת ילדיהם ובהם אברהם צדוק (נושא המחקר); ואברהם ורחל ושני בניהם.</desc>
<style>
